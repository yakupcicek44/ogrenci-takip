  <script>
    // Koyu/açık tema anında uygulanır (CSS yüklenmeden önce) — aksi halde
    // koyu moddayken kısa bir an açık renk "çakması" (flash) görülür.
    try {
      var _tema = localStorage.getItem('ogrenciTakipTema');
      if (_tema === 'light' || _tema === 'dark') document.documentElement.setAttribute('data-theme', _tema);
    } catch (e) {}
  </script>
